<style>
.tax-dialog{width:calc(100% - 32px);max-width:440px;box-sizing:border-box;border:1px solid #2c666e;border-radius:16px;padding:28px;color:#0a090c;background:#fff;}
.tax-dialog::backdrop{background:rgba(10,9,12,.55);}
.tax-dialog h3{font-size:24px;margin:0 0 12px;}
.tax-dialog p{line-height:1.6;}
.tax-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}
</style>
{% if lectura_token %}
<dialog id="tax-dialog" class="tax-dialog" open aria-labelledby="tax-title" aria-describedby="tax-description">
<h3 id="tax-title">Tasa de IGV / IVA</h3>
<p id="tax-description">El ejercicio indica operaciones con impuesto, pero no especifica su tasa. ¿Qué porcentaje corresponde?</p>
{% if error_tasa %}<p class="message message-error" role="alert">{{ error_tasa }}</p>{% endif %}
<form method="post">{% csrf_token %}
<input type="hidden" name="lectura_token" value="{{ lectura_token }}">
<label for="tasa-impuesto">Porcentaje (%)</label>
<input id="tasa-impuesto" name="tasa_impuesto" type="number" min="0" max="100" step="0.01" required autofocus placeholder="Ej. 18" value="{{ tasa_ingresada }}">
<div class="tax-actions"><button class="btn btn-primary" type="submit">Continuar</button><a class="btn btn-secondary" href="{{ request.path }}">Cancelar</a></div>
</form></dialog>
{% endif %}
