name: Django accounting and isolation tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: broadbros_ci
          POSTGRES_USER: broadbros_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U broadbros_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-production-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      SQLITE_PATH: /tmp/broadbros-ci.sqlite3
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://broadbros_ci:ci-only-password@localhost:5432/broadbros_ci' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-render.txt
      - run: python -m pip install -r requirements-render.txt
      - if: matrix.database == 'postgres'
        run: python -m pip install -r requirements-optional.txt
      - run: python -m pip check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python -m gunicorn --check-config --config gunicorn.conf.py contabilidad.wsgi:application
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          RENDER: 'true'
